# Dependency updates. Each ecosystem gets one grouped PR for minor and patch updates and a
# separate grouped PR for major updates, so routine bumps stay small and breaking ones are
# reviewed on their own.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/CatandomizerService"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      nuget-catandomizerservice-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      nuget-catandomizerservice-major:
        update-types:
          - "major"

  - package-ecosystem: "nuget"
    directory: "/CatandomizerApp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      nuget-catandomizerapp-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      nuget-catandomizerapp-major:
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      actions-major:
        update-types:
          - "major"
