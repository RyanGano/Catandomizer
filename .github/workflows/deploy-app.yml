name: Deploy App

# Deploys CatandomizerApp (Blazor WebAssembly client) to the Azure App
# Service "Catandomizer". The publish output includes a web.config that
# rewrites all requests into the wwwroot/ subfolder, so the whole publish
# folder is deployed to the site root.

on:
  push:
    branches: [master]
    paths:
      - "CatandomizerApp/**"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch: # allow manual runs from the Actions tab

# Serialize deploys of this app. cancel-in-progress is false on purpose:
# interrupting a deploy mid-flight can leave the App Service in a broken
# state, so a superseded run is allowed to finish first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# The deploy signs in to Azure with OIDC (a federated credential on an Entra
# app registration that trusts only this repo's master branch), so it needs
# id-token: write. No long-lived publish profile is stored in the repo.
permissions:
  contents: read
  id-token: write

env:
  AZURE_WEBAPP_NAME: Catandomizer
  PROJECT_PATH: CatandomizerApp/CatandomizerApp.csproj
  DOTNET_VERSION: "10.0.x"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ${{ github.workspace }}/publish

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ github.workspace }}/publish
